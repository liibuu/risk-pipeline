version: 2

models:

  # -- DIMENSIONS ------------------------------------------------

  - name: dim_customer
    description: "SCD Type 2 customer dimension - one row per customer per version"
    columns:
      - name: dim_customer_sk
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: client_sex
        tests:
          - accepted_values:
              values: ['M', 'F', 'U']
              config:
                severity: warn
      - name: current_flag
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]

  - name: dim_date
    description: "Calendar date spine 2015-2030"
    columns:
      - name: date_id
        tests: [not_null, unique]
      - name: calendar_date
        tests: [not_null, unique]

  - name: dim_currency
    description: "Currency codes - VND is domestic base currency"
    columns:
      - name: currency_sk
        tests: [not_null, unique]
      - name: currency_code
        tests: [not_null, unique]
      - name: is_domestic
        tests:
          - accepted_values:
              values: [0, 1]

  - name: dim_fin_inst
    description: "Counterparty financial institutions on transactions"
    columns:
      - name: fin_inst_sk
        tests: [not_null, unique]
      - name: fin_inst_id
        tests: [not_null, unique]

  - name: dim_branch
    description: "Bank branches - sourced from cards and loans"
    columns:
      - name: branch_sk
        tests: [not_null, unique]
      - name: branch_code
        tests: [not_null, unique]

  - name: dim_card_subtype
    description: "Credit card subtypes - Platinum, Diamond World Lady, StepUp"
    columns:
      - name: card_subtype_sk
        tests: [not_null, unique]
      - name: card_subtype
        tests: [not_null, unique]        

  # -- FACTS -----------------------------------------------------

  - name: fact_transactions
    description: "Grain: one row per financial transaction"
    columns:
      - name: fact_txn_sk
        tests: [not_null, unique]
      - name: txn_id
        tests: [not_null]
      - name: trans_amount
        tests:
          - not_null:
              config:
                severity: warn
      - name: date_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
              config:
                severity: warn
      - name: is_amount_suspect
        tests:
          - accepted_values:
              values: [0, 1]
      - name: is_lv_mismatch
        tests:
          - accepted_values:
              values: [0, 1]
      - name: currency_sk
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_sk
              config:
                severity: warn
      - name: fin_inst_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_fin_inst')
                field: fin_inst_sk
              config:
                severity: warn              


  - name: fact_card_snapshot
    description: "Grain: one row per card (latest snapshot)"
    columns:
      - name: fact_card_sk
        tests: [not_null, unique]
      - name: card_id
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['ACTIVE', 'EXPIRED', 'BLOCKED']
      - name: is_active
        tests:
          - accepted_values:
              values: [0, 1]
      - name: is_blocked
        tests:
          - accepted_values:
              values: [0, 1]
      - name: is_expired
        tests:
          - accepted_values:
              values: [0, 1]
      - name: branch_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_branch')
                field: branch_sk
              config:
                severity: warn
      - name: card_subtype_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_card_subtype')
                field: card_subtype_sk
              config:
                severity: warn


  - name: fact_loan_snapshot
    description: "Grain: one row per loan (latest snapshot)"
    columns:
      - name: fact_loan_sk
        tests: [not_null, unique]
      - name: loan_id
        tests: [not_null]
      - name: loan_type
        tests:
          - accepted_values:
              values: ['MORTGAGE', 'BUSINESS', 'PERSONAL', 'AUTO']
      - name: is_outstanding
        tests:
          - accepted_values:
              values: [0, 1]
      - name: branch_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_branch')
                field: branch_sk
              config:
                severity: warn         

  - name: fact_account_snapshot    
    description: "Account snapshot - one row per account per month"
    columns:
      - name: fact_account_snapshot_sk      
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
      - name: account_type
        tests:
          - accepted_values:
              values: ['CURRENT', 'TERM_DEPOSIT']
      - name: is_balance_suspect
        tests:
          - accepted_values:
              values: [0, 1]  
      - name: is_open
        tests:
          - accepted_values:
              values: [0, 1]        
      - name: customer_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: dim_customer_sk
              config:
                severity: warn                       
