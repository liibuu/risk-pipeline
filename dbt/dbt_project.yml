name: risk_pipeline
version: '1.0.0'
config-version: 2

profile: risk_pipeline

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

dispatch:
  - macro_namespace: dbt
    search_order: ['risk_pipeline', 'dbt']

models:
  risk_pipeline:
    raw:
      +materialized: view
      +schema: raw
    curated:
      +materialized: incremental
      +schema: curated
      hubs:
        +materialized: incremental
      links:
        +materialized: incremental
      satellites:
        +materialized: incremental
    mart:
      +materialized: incremental
      +schema: mart

tests:
  risk_pipeline:
    +schema: dbt_test